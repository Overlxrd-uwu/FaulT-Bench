! dswa1/etc/frr/frr.conf
hostname DSW-A1
password zebra
enable password zebra
!
interface lo
 ip address 10.0.0.79/32
!
! L3 uplinks to core (must be ACTIVE to form adjacencies)
interface eth5
 ip ospf area 0
!
interface eth6
 ip ospf area 0
!
! VLAN SVIs — passive (no OSPF peers on host VLANs)
interface br0.10
 ip ospf area 0
!
interface br0.20
 ip ospf area 0
!
interface br0.40
 ip ospf area 0
!
interface br0.99
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.79
 log-adjacency-changes
 ! Passive interfaces (mirrors Cisco DSW-A1 `passive-interface Vlan10/20/40`).
 ! Previous translation set `ip ospf passive` on EVERY interface including the
 ! L3 uplinks eth5/eth6, which prevented adjacencies with CSW1/CSW2 from
 ! ever forming and broke OSPF entirely on this router.
 passive-interface lo
 passive-interface br0.10
 passive-interface br0.20
 passive-interface br0.40
!
log file /var/log/frr/frr.log
