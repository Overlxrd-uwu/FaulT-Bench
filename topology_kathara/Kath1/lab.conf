# lab.conf

# Machine Definition (Using simple identifier 'aswa1')
aswa1[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client Connection)
aswa1[0]="CD_CLIENT_A1"
# Cisco Fa0/2 -> Kathara eth1 (Downlink/AP)
aswa1[1]="CD_LINK_A2"

# Cisco Gi0/1 -> Kathara eth2 (Uplink to DSW-1)
aswa1[2]="CD_DSW_1_A1"

# Cisco Gi0/2 -> Kathara eth3 (Uplink to DSW-2)
aswa1[3]="CD_DSW_2_A1"

aswa2[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client + IP Phone)
aswa2[0]="link_a2_pc"

# Cisco Gi0/1 -> Kathara eth1 (Uplink to DSW-1)
aswa2[1]="CD_DSW_1_A2"

# Cisco Gi0/2 -> Kathara eth2 (Uplink to DSW-2)
aswa2[2]="CD_DSW_2_A2"

# ASW-A3 Configuration
aswa3[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client + IP Phone)
aswa3[0]="CD_CLIENT_A3"

# Cisco Gi0/1 -> Kathara eth1 (Uplink to DSW-1)
aswa3[1]="CD_DSW_1_A3"

# Cisco Gi0/2 -> Kathara eth2 (Uplink to DSW-2)
aswa3[2]="CD_DSW_2_A3"

# DSW-A1 Configuration
dswa1[image]="frr-with-vrrp-relay"

# 1. Downlinks to Access Switches (Matches previous ASW configs)
dswa1[0]="CD_DSW_1_A1"  # Connects to aswa1
dswa1[1]="CD_DSW_1_A2"  # Connects to aswa2
dswa1[2]="CD_DSW_1_A3"  # Connects to aswa3

# 2. Port-Channel Link to Peer DSW-A2 (2 physical cables)
dswa1[3]="CD_DSW_PEER_1"
dswa1[4]="CD_DSW_PEER_2"

# 3. L3 Uplinks to Core Routers
dswa1[5]="CD_CORE_1_DSW1"
dswa1[6]="CD_CORE_2_DSW1"

# DSW-A2 Configuration
dswa2[image]="frr-with-vrrp-relay"

# 1. Downlinks to Access Switches (Matches 'aswaX' eth2 connections)
dswa2[0]="CD_DSW_2_A1"  # Connects to aswa1
dswa2[1]="CD_DSW_2_A2"  # Connects to aswa2
dswa2[2]="CD_DSW_2_A3"  # Connects to aswa3

# 2. Port-Channel Link to Peer DSW-A1 (Same domains as dswa1)
dswa2[3]="CD_DSW_PEER_1"
dswa2[4]="CD_DSW_PEER_2"

# 3. L3 Uplinks to Core Routers (New domains)
dswa2[5]="CD_CORE_1_DSW2"
dswa2[6]="CD_CORE_2_DSW2"

# ASW-B1 Configuration
aswb1[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client in VLAN 99)
aswb1[0]="CD_CLIENT_B1"

# Cisco Gi0/1 -> Kathara eth1 (Uplink to DSW-B1)
aswb1[1]="CD_DSW_1_B1"

# Cisco Gi0/2 -> Kathara eth2 (Uplink to DSW-B2)
aswb1[2]="CD_DSW_2_B1"

# ASW-B2 Configuration
aswb2[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client + IP Phone)
aswb2[0]="CD_CLIENT_B2"

# Cisco Gi0/1 -> Kathara eth1 (Uplink to DSW-B1)
aswb2[1]="CD_DSW_1_B2"

# Cisco Gi0/2 -> Kathara eth2 (Uplink to DSW-B2)
aswb2[2]="CD_DSW_2_B2"

# ASW-B3 Configuration
aswb3[image]="kathara/frr"

# Interface Mappings
# Cisco Fa0/1 -> Kathara eth0 (Client in VLAN 30)
aswb3[0]="CD_CLIENT_B3"

# Cisco Gi0/1 -> Kathara eth1 (Uplink to DSW-B1)
aswb3[1]="CD_DSW_1_B3"

# Cisco Gi0/2 -> Kathara eth2 (Uplink to DSW-B2)
aswb3[2]="CD_DSW_2_B3"

# DSW-B1 Configuration
dswb1[image]="frr-with-vrrp-relay"

# 1. Downlinks to Access Switches (Block B)
dswb1[0]="CD_DSW_1_B1"  # Connects to aswb1
dswb1[1]="CD_DSW_1_B2"  # Connects to aswb2
dswb1[2]="CD_DSW_1_B3"  # Connects to aswb3

# 2. Port-Channel Link to Peer DSW-B2
dswb1[3]="CD_DSW_PEER_B_1"
dswb1[4]="CD_DSW_PEER_B_2"

# 3. L3 Uplinks to Core Routers
dswb1[5]="CD_CORE_1_DSWB1"
dswb1[6]="CD_CORE_2_DSWB1"

# DSW-B2 Configuration
dswb2[image]="frr-with-vrrp-relay"

# 1. Downlinks to Access Switches (Block B)
dswb2[0]="CD_DSW_2_B1"  # Connects to aswb1
dswb2[1]="CD_DSW_2_B2"  # Connects to aswb2
dswb2[2]="CD_DSW_2_B3"  # Connects to aswb3

# 2. Port-Channel Link to Peer DSW-B1
dswb2[3]="CD_DSW_PEER_B_1"
dswb2[4]="CD_DSW_PEER_B_2"

# 3. L3 Uplinks to Core Routers
dswb2[5]="CD_CORE_1_DSWB2"
dswb2[6]="CD_CORE_2_DSWB2"

# CSW1 Configuration
csw1[image]="kathara/frr"
csw1[sysctl]="net.ipv6.conf.all.disable_ipv6=0"
# 1. Connection to WAN Router (Gi1/0/1)
csw1[0]="CD_WAN_LINK_1"

# 2. Port-Channel Link to Peer CSW2 (Gi1/0/2, Gi1/0/3)
csw1[1]="CD_CORE_PEER_1"
csw1[2]="CD_CORE_PEER_2"

# 3. Downlinks to Distribution Layer (Matches previous configs)
# Gi1/1/1 -> DSW-A1
csw1[3]="CD_CORE_1_DSW1"
# Gi1/1/2 -> DSW-A2
csw1[4]="CD_CORE_1_DSW2"
# Gi1/1/3 -> DSW-B1
csw1[5]="CD_CORE_1_DSWB1"
# Gi1/1/4 -> DSW-B2
csw1[6]="CD_CORE_1_DSWB2"

# CSW2 Configuration
csw2[image]="kathara/frr"
csw2[sysctl]="net.ipv6.conf.all.disable_ipv6=0"
# 1. Connection to WAN Router 2 (Gi1/0/1)
csw2[0]="CD_WAN_LINK_2"

# 2. Port-Channel Link to Peer CSW1 (Gi1/0/2, Gi1/0/3)
# MUST match the domains used on csw1
csw2[1]="CD_CORE_PEER_1"
csw2[2]="CD_CORE_PEER_2"

# 3. Downlinks to Distribution Layer (Secondary Uplinks)
# Gi1/1/1 -> DSW-A1 (Secondary)
csw2[3]="CD_CORE_2_DSW1"
# Gi1/1/2 -> DSW-A2 (Secondary)
csw2[4]="CD_CORE_2_DSW2"
# Gi1/1/3 -> DSW-B1 (Secondary)
csw2[5]="CD_CORE_2_DSWB1"
# Gi1/1/4 -> DSW-B2 (Secondary)
csw2[6]="CD_CORE_2_DSWB2"

# ISPA Configuration
ispa[image]="kathara/dhcp"
ispa[sysctl]="net.ipv6.conf.all.disable_ipv6=0"

# 1. Link to Customer R1 (Gi0/0/0)
ispa[0]="CD_ISP_R1"

# 2. Link to Upstream/Peer ISPB (Gi0/1/0)
ispa[1]="CD_ISPA_ISPB"

# ISPB Configuration
ispb[image]="kathara/dhcp"

# 1. Link to Customer R1 (Gi0/0/0)
ispb[0]="CD_ISPB_R1"

# 2. Link to Peer ISPA (Gi0/1/0)
# MUST match the collision domain used in ISPA's config
ispb[1]="CD_ISPA_ISPB"

# R1 Configuration
r1[image]="kathara/dhcp"
r1[sysctl]="net.ipv6.conf.all.disable_ipv6=0"

# 1. Downlinks to Core Layer
r1[0]="CD_WAN_LINK_1"  # To CSW1
r1[1]="CD_WAN_LINK_2"  # To CSW2

# 2. Uplinks to Internet (ISPs)
r1[2]="CD_ISP_R1"      # To ISPA (Primary)
r1[3]="CD_ISPB_R1"     # To ISPB (Secondary)


# ============================================================================
# End-host PCs and Laptops (per Office A / Office B diagram)
# Phones, WLC, LWAPs excluded by design.
# SRV1 RESTORED 2026-06-25: it is the campus DNS resolver at 10.5.0.4 (VLAN 30)
# that r1's DHCP hands out (option domain-name-servers 10.5.0.4) and that r1 1:1
# NATs to 203.0.113.113. The original port dropped the host but kept those
# references, leaving a dangling resolver that contaminated the "Internet-down"
# negative control. Re-adding it makes that baseline genuinely healthy.
# Laptop2 (Office B WiFi) dropped — no WiFi VLAN/pool exists in original Cisco.
# ============================================================================

# Laptop1 — Office A WiFi user, modeled as wired on VLAN 40 via ASW-A1 eth1
laptop1[image]="kathara/base"
laptop1[0]="CD_LINK_A2"

# PC1 — Office A, ASW-A2 eth0 (VLAN 10)
pc1[image]="kathara/base"
pc1[0]="link_a2_pc"

# PC2 — Office A, ASW-A3 eth0 (VLAN 10)
pc2[image]="kathara/base"
pc2[0]="CD_CLIENT_A3"

# PC3 — Office B, ASW-B2 eth0 (VLAN 10)
pc3[image]="kathara/base"
pc3[0]="CD_CLIENT_B2"

# SRV1 — Office B server, VLAN 30 (10.5.0.4): the campus DNS resolver. Plugs into
# ASW-B3 eth0 (the VLAN-30 server access port, CD_CLIENT_B3), gateway 10.5.0.1.
srv1[image]="kathara/base"
srv1[0]="CD_CLIENT_B3"


