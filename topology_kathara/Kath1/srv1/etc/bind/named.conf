// SRV1 campus DNS — minimal authoritative resolver for jeremysitlab.com.
// Offline lab: no upstream, so recursion is off and the server answers its own
// zone only (clients/agents that probe 10.5.0.4 get live ARP + DNS responses,
// so the "missing DNS server" baseline gap is gone).
options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    listen-on { any; };
    dnssec-validation no;
};

zone "jeremysitlab.com" {
    type master;
    file "/etc/bind/db.jeremysitlab";
};
