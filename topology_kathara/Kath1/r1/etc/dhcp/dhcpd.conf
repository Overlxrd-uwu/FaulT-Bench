# Global Options
option domain-name "jeremysitlab.com";
option domain-name-servers 10.5.0.4;
default-lease-time 600;
max-lease-time 7200;
authoritative;
# Force OFFER/ACK as broadcast back via the relay so legacy-brctl bridges
# don't have to handle the unicast-via-giaddr path correctly.
always-broadcast on;

# --- Subnets (Remote VLANs Relayed by Switches) ---

# Pool: A-Mgmt (10.0.0.0/28)
subnet 10.0.0.0 netmask 255.255.255.240 {
  range 10.0.0.11 10.0.0.14;
  option routers 10.0.0.1;
  option vendor-encapsulated-options f1:04:0a:00:00:07; # Option 43
}

# Pool: A-PC (10.1.0.0/24)
subnet 10.1.0.0 netmask 255.255.255.0 {
  range 10.1.0.11 10.1.0.254;
  option routers 10.1.0.1;
}

# Pool: A-Phone (10.2.0.0/24)
subnet 10.2.0.0 netmask 255.255.255.0 {
  range 10.2.0.11 10.2.0.254;
  option routers 10.2.0.1;
}

# Pool: B-Mgmt (10.0.0.16/28)
subnet 10.0.0.16 netmask 255.255.255.240 {
  range 10.0.0.27 10.0.0.30;
  option routers 10.0.0.17;
  option vendor-encapsulated-options f1:04:0a:00:00:07; # Option 43
}

# Pool: B-PC (10.3.0.0/24)
subnet 10.3.0.0 netmask 255.255.255.0 {
  range 10.3.0.11 10.3.0.254;
  option routers 10.3.0.1;
}

# Pool: B-Phone (10.4.0.0/24)
subnet 10.4.0.0 netmask 255.255.255.0 {
  range 10.4.0.11 10.4.0.254;
  option routers 10.4.0.1;
}

# Pool: Wi-Fi (10.6.0.0/24)
subnet 10.6.0.0 netmask 255.255.255.0 {
  range 10.6.0.11 10.6.0.254;
  option routers 10.6.0.1;
}

# --- Empty Declarations for Local Interfaces (Required) ---
# These prevent the server from crashing on startup
subnet 10.0.0.32 netmask 255.255.255.252 {} # Link to CSW1
subnet 10.0.0.36 netmask 255.255.255.252 {} # Link to CSW2
# Note: WAN links are handled by the client side, but we declare them empty just in case
subnet 203.0.113.0 netmask 255.255.255.252 {} 
subnet 203.0.113.4 netmask 255.255.255.252 {}