hostname R11
password zebra

! OSPF in the global table (area 3 toward R1), redistributing EIGRP.
router ospf
 network 111.0.0.0/8 area 3
 redistribute eigrp
 ! Pick up 112.0.0.0/8 and 103.0.0.0/8: zebra prefers Connected over EIGRP
 ! for R11's own interfaces, so `redistribute eigrp` alone skips them.
 redistribute connected
!

! EIGRP — single AS 100 covering both R12 (eth0, 112.x) and R13 (eth2, 103.x).
! The Cisco original used two ASes (100 toward R12, 300 toward R13). Stock FRR's
! eigrpd is single-instance-per-VRF, so the dual-AS design only ran one daemon
! anyway. R13 was updated to AS 100 to match; everything still routes.
router eigrp 100
 network 112.0.0.0/8
 network 103.0.0.0/8
 ! NOTE (intended design): OSPF routes are NOT redistributed into EIGRP.
 ! FRR eigrpd's `redistribute ospf` is a silent no-op (skeletal daemon), so
 ! the lab compensates with static default routes on R12/R13 toward R11
 ! (see r12.startup / r13.startup). Return-path routing to the OSPF side
 ! works via those defaults BY DESIGN; the dead `redistribute ospf` line
 ! was removed 2026-07-12 as misleading no-op config. The EIGRP -> OSPF
 ! direction (router ospf / redistribute eigrp above) IS live.
!

log file /var/log/frr/frr.log
