hostname R8
password zebra
enable password zebra

router ospf
 # Network statements
 network 58.0.0.0/8 area 1
 network 80.0.0.0/8 area 2

 # Loopback networks (summarized to /8)
 network 18.0.0.0/8 area 2

 # Virtual Link Configuration
 # Connects Area 2 to the backbone via R4 (Router ID 14.1.4.1) through Area 1
 area 1 virtual-link 14.1.4.1

!
log file /var/log/frr/frr.log