hostname R4
password zebra
enable password zebra

router ospf
 # Network statements
 network 34.0.0.0/8 area 0
 network 45.0.0.0/8 area 1
 network 46.0.0.0/8 area 1
 network 40.0.0.0/8 area 1
 
 # Loopback networks (summarized to /8 in the Cisco config, so we keep that behavior)
 network 14.0.0.0/8 area 1

 # Virtual Link Configuration
 # Connects Area 1 to the backbone (Area 0) via router 18.1.4.1
 area 1 virtual-link 18.1.4.1

!
log file /var/log/frr/frr.log