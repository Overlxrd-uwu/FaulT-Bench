hostname R13
password zebra
enable password zebra

! EIGRP AS aligned with R11/R12 (was AS 300 in the Cisco original;
! collapsed to AS 100 because stock FRR eigrpd is single-instance-per-VRF).
router eigrp 100
 network 103.0.0.0/8
 ! Each loopback /24 sits on its own dummy interface (see r13.startup) so
 ! FRR eigrpd picks them all up via these network statements.
 network 113.1.1.0/24
 network 113.1.2.0/24
 network 113.1.3.0/24
 network 113.1.4.0/24
!
log file /var/log/frr/frr.log
