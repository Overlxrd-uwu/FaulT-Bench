hostname R12
password zebra
enable password zebra

router eigrp 100
 network 112.0.0.0/8
 network 120.0.0.0/8
 ! Each loopback /24 sits on its own dummy interface (see r12.startup) so
 ! FRR eigrpd picks them all up via these network statements.
 network 102.1.1.0/24
 network 102.1.2.0/24
 network 102.1.3.0/24
 network 102.1.4.0/24
!
log file /var/log/frr/frr.log