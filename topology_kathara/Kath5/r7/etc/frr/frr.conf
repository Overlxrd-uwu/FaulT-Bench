hostname R7
password zebra
enable password zebra

! Single OSPF instance. The Cisco original used `router ospf 111` plus a
! second `router ospf 222` whose only purpose was to advertise 17.x and
! 70.x via cross-process redistribution. Stock Kathará FRR runs ospfd in
! traditional (single-instance) mode, so we declare the same networks
! directly. Reachability is preserved; the routes appear as intra-area
! in area 1 instead of E1 externals.
router ospf
 ospf router-id 67.1.1.2
 network 67.0.0.0/8 area 1
 network 70.0.0.0/8 area 1
 network 17.1.1.0/24 area 1
 network 17.1.2.0/24 area 1
 network 17.1.3.0/24 area 1
 network 17.1.4.0/24 area 1
!

log file /var/log/frr/frr.log
