# --- Router 0 (IT & Computer Dept) ---
# eth0 -> Switch0 (IT Dept 192.168.1.0/24)
# eth1 -> Switch1 (Computer Dept 192.168.2.0/24)
# eth2 -> Serial Link to Router1 (10.0.0.0/8)

router0[0]="link_r0_sw0"
router0[1]="link_r0_sw1"
router0[2]="wan_r0_r1"
router0[image]="kathara/frr"

# --- Router 1 (Office & Principle Room) ---
# eth0 -> Switch2 (Office 192.168.3.0/24)
# eth1 -> Switch3 (Principle 192.168.4.0/24)
# eth2 -> WAN to Router0 (10.0.0.0/8) - Matches Router0's link
# eth3 -> WAN to Router2 (20.0.0.0/8)

router1[0]="link_r1_sw2"
router1[1]="link_r1_sw3"
router1[2]="wan_r0_r1"
router1[3]="wan_r1_r2"
router1[image]="kathara/frr"

# --- Router 2 (Server Room & Internet Lab) ---
# eth0 -> Switch4 (Server Room 1.0.0.0/8)
# eth1 -> Switch_Internet (Internet Lab 128.168.0.0/16)
# eth2 -> WAN Link to Router1 (20.0.0.0/8)

router2[0]="link_r2_sw4"
router2[1]="link_r2_sw5"
router2[2]="wan_r1_r2"
router2[image]="kathara/frr"

# --- Link: Router0 to Switch0 ---
# Router0 (eth0) connects to Switch0 (eth0)
switch0[0]="link_r0_sw0"

# --- Link: Switch0 to IT Department Devices ---
# Switch0 (eth1) exposes the LAN for printers/PCs
switch0[1]="lan_it"

# Use a standard base image (Alpine Linux) for L2 switching
switch0[image]="kathara/base"


switch1[0]="link_r0_sw1"

# --- Link: Switch1 to Computer Dept Devices ---
# Switch1 (eth1) exposes the LAN for PCs/Printers
switch1[1]="lan_cs"

# Use standard base image
switch1[image]="kathara/base"

# --- Link: Router 1 to Switch 2 (Office Dept) ---
# Router 1 (eth0) connects to Switch 2 (eth0)
# Note: Ensure you update router1[0] to match this link name

switch2[0]="link_r1_sw2"

# --- Link: Switch 2 to Office Devices ---
# Switch 2 (eth1) exposes the LAN for Printers/PCs (192.168.3.x)
switch2[1]="lan_office"

# Use standard base image
switch2[image]="kathara/base"


switch3[0]="link_r1_sw3"

# --- Link: Switch 3 to Principle Devices ---
# Switch 3 (eth1) exposes the LAN (192.168.4.x)
switch3[1]="lan_principle"

# Use standard base image
switch3[image]="kathara/base"



switch4[0]="link_r2_sw4"

# --- Link: Switch 4 to Server Devices (FTP, DNS, WEB) ---
switch4[1]="lan_servers"

# Use standard base image
switch4[image]="kathara/base"


switch5[0]="link_r2_sw5"

# --- Link: Switch 5 to Internet Lab Devices ---
# Switch 5 (eth1) exposes the LAN (128.168.0.x)
switch5[1]="lan_internet"

# Use standard base image
switch5[image]="kathara/base"


# ============================================================================
# End-host PCs / laptops per clear College Network diagram
# Printers (Printer0/1/2/3/4/5) and servers (DNS/FTP/WEB) excluded per spec.
# Each subnet's hosts share their switch's "lan_*" collision domain.
# ============================================================================

# --- IT Department (192.168.1.0/24) on Switch0/lan_it ---
it_hod[0]="lan_it"
it_lab1[0]="lan_it"
it_lab2[0]="lan_it"
it_lab3[0]="lan_it"
it_lab4[0]="lan_it"

# --- Computer Department (192.168.2.0/24) on Switch1/lan_cs ---
cs_hod[0]="lan_cs"
cs_lab1[0]="lan_cs"
cs_lab2[0]="lan_cs"
cs_lab3[0]="lan_cs"
cs_lab4[0]="lan_cs"

# --- Other zone (192.168.3.0/24) on Switch2/lan_office ---
office_pc[0]="lan_office"
exam_cell[0]="lan_office"
enquiry[0]="lan_office"
tpo[0]="lan_office"

# --- Principle Room (192.168.4.0/24) on Switch3/lan_principle ---
pc0[0]="lan_principle"
laptop0[0]="lan_principle"

# --- Server Room (1.0.0.0/8) on Switch4/lan_servers ---
pc1[0]="lan_servers"

# --- Internet Lab (128.168.0.0/16) on Switch5/lan_internet ---
pc2[0]="lan_internet"
pc3[0]="lan_internet"
pc4[0]="lan_internet"
pc5[0]="lan_internet"

