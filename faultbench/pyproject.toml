[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faultbench"
version = "1.0.0"
description = "FaulT-Bench: free-text evaluation pipeline for network-troubleshooting agents (SADE, CC-Baseline, ReAct) on 8 emulated topologies with realistic trouble tickets."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "claude-agent-sdk",
    "kathara>=3.7",
    "func-timeout>=4.3",
    "mcp>=1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["faultbench*"]
